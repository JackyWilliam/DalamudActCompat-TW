name: Taiwan Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            9.0.x
      - name: Build and validate Taiwan candidate
        shell: pwsh
        run: ./tools/build-taiwan.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dact-taiwan-candidate-${{ github.run_id }}
          path: artifacts/taiwan/*
          if-no-files-found: error
